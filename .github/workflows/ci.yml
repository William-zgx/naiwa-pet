name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check shell syntax and asset manifest
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          python3 -m json.tool assets/assets.json > /dev/null

      - name: Build for Apple silicon
        run: swift build -c release --triple arm64-apple-macosx13.0

      - name: Build for Intel
        run: swift build -c release --triple x86_64-apple-macosx13.0

      - name: Run regression tests
        run: swift test

      - name: Package and verify the universal app
        run: |
          bash scripts/build_app.sh
          plutil -lint build/Naiwa.app/Contents/Info.plist
          lipo build/Naiwa.app/Contents/MacOS/naiwa -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/Naiwa.app
          build/Naiwa.app/Contents/MacOS/naiwa pets
